        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
        }
      }

<style>
:root{
  color-scheme:light;
  --bg:#FBF8EE; --surface:#FFFFFF; --surface-2:#F5F1E3; --ink:#26301F; --ink-2:#66675A; --line:#E8E2CF;
  --tag:#F3C95A; --tag-ink:#2A2000; --primary:#2F5A35; --on-primary:#FFFFFF;
  --red:#B23A2A; --red-bg:#FBE9E3; --green:#2E6B3A; --green-bg:#E6F2E4; --amber:#8A5A00; --amber-bg:#FFF1CC;
  --hole:var(--surface);
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
html,body{margin:0}
body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:16px/1.45 'Noto Sans Thai','Sarabun','Leelawadee UI','Thonburi',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h2,h3{font-family:'Mitr','Noto Sans Thai',system-ui,sans-serif;font-weight:500;margin:0}
h2{font-size:20px} h3{font-size:16px}
small,.muted{color:var(--ink-2)}
.muted{font-size:14px}

#app{height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{height:34px;width:auto;border-radius:8px;background:#FFFFF7;flex:none;padding:2px 5px;display:block}
.loadlogo{width:170px;height:auto;border-radius:14px;background:#FFFFF7;margin:0 auto 14px;display:block}
.brand{font-family:'Mitr','Noto Sans Thai',sans-serif;font-weight:500;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode{font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap}
.mode.shared{background:var(--green-bg);color:var(--green)}
.mode.local{background:var(--amber-bg);color:var(--amber)}
.mode.ro{background:var(--red-bg);color:var(--red)}
main#main{flex:1;min-height:0;overflow:auto}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
nav.tabs button{flex:1;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-2);background:none;border:0}
nav.tabs button[aria-selected="true"]{color:var(--primary);font-weight:600}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* price tag — the one loud element */
.tag{display:inline-block;position:relative;font-family:'Mitr','Noto Sans Thai',sans-serif;font-weight:500;background:var(--tag);color:var(--tag-ink);
  padding:2px 12px 2px 20px;border-radius:3px 12px 12px 3px;font-size:17px;line-height:1.35;white-space:nowrap}
.tag::before{content:'';position:absolute;left:7px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--hole)}
.tag.big{font-size:24px;padding:3px 16px 3px 26px}
.tag.big::before{left:9px;width:8px;height:8px;margin-top:-4px}

/* sell */
.sell{height:100%;display:flex;position:relative}
.catalog{flex:1;min-width:0;display:flex;flex-direction:column}
.searchrow{padding:10px 12px 6px;display:flex;gap:8px;align-items:center}
.searchrow input{flex:1;min-width:0}
.searchrow .btn{white-space:nowrap;padding:10px 12px}
input[type=search],input[type=text]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline-offset:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{flex:1;overflow:auto;padding:4px 12px 100px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0;min-height:88px;
  display:flex;flex-direction:column;justify-content:flex-start}
.pic{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px 9px 0 0;background:var(--surface-2)}
.pic.ph{display:grid;place-items:center;font-family:'Mitr','Noto Sans Thai',sans-serif;font-size:36px;color:var(--ink-2)}
.tile.compact .pic{display:none}
.tbody{padding:8px 10px 9px;display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-between}
.tile.compact .tbody{padding:10px;min-height:86px}
.tile:active{transform:scale(.98)}
.tile.in{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.tname{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.stk{font-size:12px;color:var(--ink-2);text-align:right}
.stk.low{color:var(--amber);font-weight:600}
.stk.out{color:var(--red);font-weight:600}
.qb{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;display:grid;place-items:center}
.noeli{font-size:11px;color:var(--ink-2)}

.cart{display:none;flex-direction:column;background:var(--surface);min-height:0}
.cart.open{display:flex;position:fixed;inset:0;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:700px){
  .cart,.cart.open{display:flex;position:static;width:360px;flex:none;border-left:1px solid var(--line);padding:0}
  .cartbar{display:none!important}
  .cart .close{display:none}
  .grid{padding-bottom:20px}
}
.chead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chead h2{flex:1}
.link{background:none;border:0;color:var(--primary);padding:6px 8px;font-size:14px}
.close{background:var(--surface-2);border:0;border-radius:50%;width:36px;height:36px;font-size:16px;color:var(--ink-2)}
.lines{flex:1;overflow:auto;padding:4px 14px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.empty .btn{margin-top:14px}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) auto 72px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.lname{font-weight:500;line-height:1.3}
.lname small{display:block;font-weight:400}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:36px;height:36px;border:0;background:var(--surface-2);font-size:20px;line-height:1}
.step .qty{width:auto;min-width:40px;padding:0 6px;background:var(--surface);font-weight:600;font-size:16px}
.ltot{text-align:right;font-weight:600}
.cfoot{padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--surface)}
.disc{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:14px;color:var(--ink-2)}
.disc input{width:110px;text-align:right;padding:8px 10px}
.t2{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.t2.big{padding:8px 0 12px;font-weight:600}
.cartbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 12px 10px 16px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:600;--hole:var(--primary);box-shadow:0 4px 14px rgba(0,0,0,.25)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow .btn{flex:1}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,16,22,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:90%}}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.paytotal{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:600}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.segb{flex:1;padding:9px 6px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:500;color:var(--ink-2)}
.segb[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:14px;color:var(--ink-2);margin-bottom:5px}
.field input{font-size:18px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.quick button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.change{font-size:18px;font-weight:600;padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-bottom:14px}
.change.ok{background:var(--green-bg);color:var(--green)}
.change.bad{background:var(--red-bg);color:var(--red)}
.qrbox{background:#fff;padding:12px;border-radius:12px;width:min(300px,100%);margin:4px auto 8px;border:1px solid var(--line)}
.qrbox svg{display:block;width:100%;height:auto}
.qrcap{text-align:center;margin-bottom:14px}
.note{padding:12px;border-radius:10px;background:var(--amber-bg);color:var(--amber);margin-bottom:14px;font-size:14px}
.govbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:var(--surface-2)}
.zrow{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.zrow .lead{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-3px);min-width:12px}
.zrow b{font-weight:600}
.done{text-align:center;padding:8px 0}
.done .check{width:56px;height:56px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:30px;margin:0 auto 10px}
.done .chg{margin:14px 0;display:flex;justify-content:center;align-items:center;gap:12px;font-weight:600}

/* stock */
.stock{padding:12px 12px 24px;max-width:1100px;margin:0 auto}
.stkbar{display:flex;gap:10px;margin-bottom:10px}
.stkbar input{flex:1}
.stkbar .btn{white-space:nowrap}
.stock .chips{padding:0 0 10px}
.slist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.srow:last-child{border-bottom:0}
.sinfo b{font-weight:500}
.sinfo small{display:block}
.sqty{text-align:right;font-weight:600;font-size:18px}
.sqty small{font-size:12px;font-weight:400;margin-left:3px}
.sqty.low{color:var(--amber)} .sqty.out{color:var(--red)}
.sact{grid-column:1 / -1;display:flex;gap:8px}
.lthumb,.sthumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);font-family:'Mitr','Noto Sans Thai',sans-serif;font-size:18px;overflow:hidden}
.sthumb{width:48px;height:48px}
.photo{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.pill.red{background:var(--red-bg);color:var(--red)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.formgrid .full{grid-column:1 / -1}
.check{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-size:15px}
.check input{width:20px;height:20px}

/* back office */
.bo{padding:12px 12px 28px;max-width:1100px;margin:0 auto}
.bogrid{display:block}
@media(min-width:900px){.bogrid{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:18px;align-items:start}}
.daybar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.daybar input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.zr{background:var(--surface);border:1px solid var(--line);padding:16px 16px 14px;margin-bottom:14px;border-radius:4px 4px 14px 14px}
.zr header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.zbig{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px;margin-bottom:6px;border-bottom:2px dashed var(--line);font-weight:600}
.blk{margin-bottom:16px}
.blk h3{margin:0 0 8px}
.plain{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plain .r{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.plain .r:last-child{border-bottom:0}
details.bill{border-bottom:1px solid var(--line)}
details.bill:last-child{border-bottom:0}
details.bill summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;cursor:pointer}
details.bill summary::-webkit-details-marker{display:none}
details.bill.void summary{opacity:.55;text-decoration:line-through}
.bno{font-weight:600}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bitems{padding:2px 14px 12px;font-size:14px;color:var(--ink-2)}
.bitems .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.bmeta{padding:0 14px 12px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;align-items:flex-start}

.settings{padding:14px 14px 30px;max-width:720px;margin:0 auto}
.listrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface-2)}
.settings h3{margin:20px 0 10px}
.hint{font-size:13px;color:var(--ink-2);margin-top:4px}

.rcstyle{}
#printArea{display:none}
@media print{#app,#host,#toast{display:none!important}#printArea{display:block!important}html,body{height:auto!important;overflow:visible!important;background:#fff!important}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{display:grid;place-items:center;height:100%;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.tile:active{transform:none}}
</style>

<script>
(function(){
'use strict';

/*CORE_START*/
const money=n=>Math.round((Number(n)||0)*100)/100;
const round3=n=>Math.round((Number(n)||0)*1000)/1000;
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,'').trim());return Number.isFinite(n)?n:0;};
const pad=(n,l=2)=>String(n).padStart(l,'0');
const dayStr=(d)=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmt=n=>{n=money(n);return n.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});};
const baht=n=>'฿'+fmt(n);

function crc16(str){let crc=0xFFFF;for(let i=0;i<str.length;i++){crc^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++){crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF;}}return crc.toString(16).toUpperCase().padStart(4,'0');}
function tlv(id,val){return id+String(val.length).padStart(2,'0')+val;}
function ppPayload(target,amount){
  const t=String(target||'').replace(/\D/g,'');
  let sub,acct;
  if(t.length===10&&t[0]==='0'){sub='01';acct='0066'+t.slice(1);}
  else if(t.length===13){sub='02';acct=t;}
  else if(t.length===15){sub='03';acct=t;}
  else return null;
  const amt=money(amount);
  let p=tlv('00','01')+tlv('01',amt>0?'12':'11')+tlv('29',tlv('00','A000000677010111')+tlv(sub,acct))+tlv('53','764')+(amt>0?tlv('54',amt.toFixed(2)):'')+tlv('58','TH')+'6304';
  return p+crc16(p);
}
function calcCart(lines,discount){
  let sub=0,elig=0;
  lines.forEach(l=>{const t=money(l.price*l.qty);sub+=t;if(l.eligible!==false)elig+=t;});
  sub=money(sub);elig=money(elig);
  const disc=Math.min(Math.max(money(discount||0),0),sub);
  const total=money(sub-disc);
  const eligNet=sub>0?money(elig-disc*(elig/sub)):0;
  return {sub,elig,disc,total,eligNet};
}
function govMax(eligNet,share,cap){let g=eligNet*(num(share)/100);if(num(cap)>0)g=Math.min(g,num(cap));return money(Math.min(Math.max(g,0),eligNet));}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCsv(rows){return '\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}
function parseCsv(text){
  text=String(text).replace(/^\uFEFF/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(c=>c.trim()!==''))rows.push(row);row=[];}
    else cur+=ch;}
  row.push(cur);if(row.some(c=>c.trim()!==''))rows.push(row);
  return rows;
}
const DEF={shop:'หลองข้าว บ้านเรือน',promptpay:'',blockOut:false,logoOn:true,
  schemes:[{id:'g1',name:'โครงการรัฐ',share:50,cap:150,img:''}],qrs:[],
  taxOn:false,taxName:'',taxId:'',taxBranch:'สำนักงานใหญ่',taxAddr:'',vatRate:7};
function normSettings(raw){
  raw=raw||{};const s=Object.assign({},DEF,raw);
  if(!Array.isArray(raw.schemes)){
    s.schemes=(raw.govName!==undefined||raw.govShare!==undefined||raw.govCap!==undefined)
      ?[{id:'g1',name:raw.govName||'โครงการรัฐ',share:raw.govShare!=null?raw.govShare:50,cap:raw.govCap!=null?raw.govCap:150,img:''}]
      :DEF.schemes.map(x=>Object.assign({},x));
  }
  if(!Array.isArray(s.qrs))s.qrs=[];
  delete s.govName;delete s.govShare;delete s.govCap;
  return s;
}
const validTaxId=v=>/^\d{13}$/.test(String(v||'').replace(/\D/g,''));
function vatCalc(items,discount,rate){
  let sub=0,vg=0;
  items.forEach(it=>{const t=money(it.price*it.qty);sub+=t;if(it.vat!==false)vg+=t;});
  sub=money(sub);vg=money(vg);
  const disc=Math.min(Math.max(money(discount||0),0),sub);
  const dV=sub>0?disc*(vg/sub):0;
  const gV=money(vg-dV),gE=money(sub-vg-(disc-dV));
  const r=num(rate),base=money(gV/(1+r/100));
  return {rate:r,base:base,vat:money(gV-base),exempt:gE,total:money(gV+gE)};
}
function summarize(bills){
  const paid=bills.filter(b=>b.status!=='void');
  const r={bills:paid.length,voids:bills.length-paid.length,total:0,cash:0,qr:0,gov:0,discount:0,cost:0,vat:0,missingCost:false,items:{},govBy:{},qrBy:{}};
  paid.forEach(b=>{
    r.total+=b.total||0;r.discount+=b.discount||0;r.vat+=(b.vat&&b.vat.vat)||0;
    (b.payments||[]).forEach(p=>{
      if(p.type==='cash'||p.type==='qr'||p.type==='gov')r[p.type]+=p.amount||0;
      if(p.type==='gov'){const k=p.scheme||'โครงการรัฐ';r.govBy[k]=(r.govBy[k]||0)+(p.amount||0);}
      if(p.type==='qr'){const k=p.channel||'QR';r.qrBy[k]=(r.qrBy[k]||0)+(p.amount||0);}
    });
    (b.items||[]).forEach(it=>{
      r.cost+=(it.cost||0)*it.qty;if(!it.cost)r.missingCost=true;
      const x=r.items[it.pid]||(r.items[it.pid]={name:it.name,qty:0,rev:0});x.qty+=it.qty;x.rev+=it.price*it.qty;
    });
  });
  ['total','cash','qr','gov','discount','cost','vat'].forEach(k=>r[k]=money(r[k]));
  Object.keys(r.govBy).forEach(k=>r.govBy[k]=money(r.govBy[k]));
  Object.keys(r.qrBy).forEach(k=>r.qrBy[k]=money(r.qrBy[k]));
  r.profit=money(r.total-r.cost);
  r.top=Object.values(r.items).sort((a,b)=>b.rev-a.rev).slice(0,5);
  return r;
}

try{S.compact=localStorage.getItem('pos-compact')==='1';}catch(e){S.compact=false;}
const LS='pos-store-v1';
const W=p=>S.fb?Promise.race([p,new Promise(r=>setTimeout(r,1500))]):p;

/* ---------- data layer ---------- */
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){S.products=j.products||{};S.sales=j.sales||{};S.settings=normSettings(j.settings);}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({products:S.products,sales:S.sales,settings:S.settings}));}catch(e){}}
async function putProduct(p){if(DBH){await W(DBH.doc('products/'+p.id).set(p));}else{S.products[p.id]=p;saveLocal();render();}}
async function delProduct(id){if(DBH){await W(DBH.doc('products/'+id).delete());}else{delete S.products[id];saveLocal();render();}}
async function patchStock(id,stock){if(DBH){await W(DBH.doc('products/'+id).update({stock:stock}));}else{if(S.products[id])S.products[id]=Object.assign({},S.products[id],{stock:stock});saveLocal();}}
async function putSale(b){if(DBH){await W(DBH.doc('sales/'+b.id).set(b));}else{S.sales[b.id]=b;saveLocal();}}
async function patchSale(id,patch){if(DBH){await W(DBH.doc('sales/'+id).update(patch));}else{S.sales[id]=Object.assign({},S.sales[id],patch);saveLocal();render();}}
async function putSettings(s){if(DBH){await W(DBH.doc('settings/main').set(s));}else{S.settings=s;saveLocal();render();}}

function subscribe(){
  const err=e=>{S.ready=true;toast('เชื่อมหลังบ้านไม่ได้ ('+((e&&e.code)||'error')+')');render();};
  DBH.collection('products').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{const v=d.data();if(v)m[d.id]=v;});S.products=m;S.ready=true;render();},err);
  DBH.collection('sales').orderBy('ts','desc').limit(1000).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{const v=d.data();if(v)m[d.id]=v;});S.sales=m;render();},err);
  DBH.doc('settings/main').onSnapshot(d=>{S.settings=normSettings(d.data());render();},err);
}

/* ---------- ui helpers ---------- */
let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800);}
function openSheet(html){$('#host').innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';}
function closeSheet(){if(ASK){const r=ASK;ASK=null;r(null);}$('#host').innerHTML='';P=null;}
function ask(o){
  return new Promise(res=>{
    openSheet('<h2>'+esc(o.title)+'</h2>'+(o.body?'<p class="muted">'+esc(o.body)+'</p>':'')+
      (o.label?'<label class="field"><span>'+esc(o.label)+'</span><input id="askIn" type="text" inputmode="decimal" autocomplete="off" value="'+esc(o.value||'')+'"></label>':'')+
      '<div class="btnrow"><button class="btn ghost" data-act="ask-no">'+esc(o.cancel||'ยกเลิก')+'</button><button class="btn '+(o.danger?'danger':'primary')+'" data-act="ask-ok">'+esc(o.ok||'ตกลง')+'</button></div>');
    ASK=res;const i=$('#askIn');
    if(i){i.focus();i.select();i.addEventListener('keydown',e=>{if(e.key==='Enter')ACT['ask-ok']();});}
  });
}
async function saveFile(name,text,mime){
  mime=mime||'text/csv';
  if(S.dl){try{await S.dl.save({filename:name,data:text});toast('บันทึกไฟล์แล้ว');}catch(e){if(!e||e.code!=='declined')toast('บันทึกไฟล์ไม่ได้ในหน้านี้');}return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}catch(e){toast('บันทึกไฟล์ไม่ได้');}
}
function qrSvg(text){try{if(typeof qrcode==='undefined')return null;const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true});}catch(e){return null;}}

/* ---------- routing / render ---------- */
function setTab(t){S.tab=t;$$('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===t)));build();}
function build(){
  if(!S.ready)return;
  const m=$('#main');
  if(S.tab==='sell'){m.innerHTML=sellSkeleton();$('#q').value=S.q;}
  else if(S.tab==='stock'){m.innerHTML=stockSkeleton();$('#sq').value=S.sq;}
  else if(S.tab==='bo'){m.innerHTML=boSkeleton();}
  else {S.draft=JSON.parse(JSON.stringify(S.settings));m.innerHTML=settingsHtml();}
  refresh();
}
function render(){
  if(!S.ready)return;
  if($('#main .loading')){build();return;}
  refresh();
}
function refresh(){
  renderHeader();
  if(S.tab==='sell'){S.cart=S.cart.filter(l=>S.products[l.id]);renderCats();renderGrid();renderCart();renderCartBar();}
  else if(S.tab==='stock')renderStock();
  else if(S.tab==='bo')renderBO();
  else if(!document.activeElement||!document.activeElement.closest||!document.activeElement.closest('#setForm')){syncDraft();$('#main').innerHTML=settingsHtml();}
}
function renderHeader(){
  $('#brand').textContent=S.settings.shop||'POS ร้านชำ';
  const lm=$('#logoMark');if(lm){if(!lm.getAttribute('src'))lm.src=LOGO_MARK;lm.hidden=S.settings.logoOn===false;}
  const m=$('#mode');
  if(S.readOnly){m.className='mode ro';m.textContent='ดูอย่างเดียว';}
  else if(S.mode==='shared'){m.className='mode shared';m.textContent=S.fb?'● ซิงก์คลาวด์':'● เชื่อมหลังบ้าน';}
  else{m.className='mode local';m.textContent='● เก็บในเครื่อง';}
}

/* ---------- sell ---------- */
function sellSkeleton(){
  return '<div class="sell"><section class="catalog"><div class="searchrow"><input id="q" type="search" placeholder="ค้นหาชื่อสินค้า หรือสแกนบาร์โค้ด" autocomplete="off" enterkeyhint="search"><button id="vt" class="btn sm" data-act="view-toggle"></button></div>'+
    '<div id="cats" class="chips"></div><div id="grid" class="grid"></div></section><aside id="cart" class="cart" aria-label="ตะกร้า"></aside>'+
    '<button id="cartbar" class="cartbar" data-act="cart-open" hidden></button></div>';
}
const thumb=(p,cls)=>p.img?'<img class="'+cls+'" alt="" loading="lazy" decoding="async" src="'+esc(p.img)+'">':'<span class="'+cls+'" aria-hidden="true">'+esc((p.name||'?').trim().charAt(0))+'</span>';
const plist=()=>Object.values(S.products).sort((a,b)=>(a.cat||'').localeCompare(b.cat||'','th')||(a.name||'').localeCompare(b.name||'','th'));
function renderCats(){
  const cats=Array.from(new Set(plist().map(p=>p.cat).filter(Boolean)));
  if(S.cat!=='ทั้งหมด'&&cats.indexOf(S.cat)<0)S.cat='ทั้งหมด';
  $('#cats').innerHTML=['ทั้งหมด'].concat(cats).map(c=>'<button class="chip" data-act="cat" data-id="'+esc(c)+'" aria-pressed="'+(S.cat===c)+'">'+esc(c)+'</button>').join('');
}
function stockClass(p){const s=p.stock||0;if(s<=0)return 'out';if(s<=(p.low==null?5:p.low))return 'low';return '';}
function renderGrid(){
  const all=plist();
  const vt=$('#vt');if(vt)vt.textContent=S.compact?'แสดงรูป':'ซ่อนรูป';
  if(!all.length){
    $('#grid').innerHTML='<div class="empty" style="grid-column:1/-1"><b>ยังไม่มีสินค้าในร้าน</b><br>เพิ่มสินค้าเอง นำเข้าจากไฟล์ CSV หรือลองกับสินค้าตัวอย่างก่อนก็ได้<br>'+
      '<button class="btn primary" data-act="seed">โหลดสินค้าตัวอย่าง</button> <button class="btn" data-act="goto-stock">ไปหน้าสต็อก</button></div>';return;
  }
  const q=S.q.trim().toLowerCase();
  const list=all.filter(p=>(S.cat==='ทั้งหมด'||p.cat===S.cat)&&(!q||(p.name||'').toLowerCase().indexOf(q)>=0||(p.barcode||'').indexOf(q)>=0));
  if(!list.length){$('#grid').innerHTML='<div class="empty" style="grid-column:1/-1">ไม่พบสินค้าที่ค้นหา</div>';return;}
  const inCart={};S.cart.forEach(l=>inCart[l.id]=l.qty);
  $('#grid').innerHTML=list.map(p=>{
    const sc=stockClass(p),n=inCart[p.id];
    const pic=p.img?'<img class="pic" alt="" loading="lazy" decoding="async" src="'+esc(p.img)+'">':'<span class="pic ph" aria-hidden="true">'+esc((p.name||'?').trim().charAt(0))+'</span>';
    return '<button class="tile'+(n?' in':'')+(S.compact?' compact':'')+'" data-act="add" data-id="'+esc(p.id)+'">'+(n?'<span class="qb">'+esc(n)+'</span>':'')+pic+
      '<span class="tbody"><span class="tname">'+esc(p.name)+'</span><span class="trow"><span class="tag">'+baht(p.price)+'</span>'+
      '<span class="stk '+sc+'">'+(sc==='out'?'หมด':'เหลือ '+esc(fmt(p.stock||0)))+(p.eligible===false?'<br><span class="noeli">ไม่ร่วมโครงการ</span>':'')+'</span></span></span></button>';
  }).join('');
}
function cartLines(){return S.cart.map(l=>{const p=S.products[l.id];return {id:l.id,qty:l.qty,price:p.price,eligible:p.eligible!==false,p:p};});}
function calc(){return calcCart(cartLines(),S.discount);}
function renderCart(){
  const lines=cartLines();
  const body=lines.length?lines.map(l=>'<div class="line">'+thumb(l.p,'lthumb')+'<div class="lname">'+esc(l.p.name)+'<small>'+baht(l.price)+(l.p.unit?' / '+esc(l.p.unit):'')+'</small></div>'+
    '<div class="step"><button data-act="dec" data-id="'+esc(l.id)+'" aria-label="ลด">−</button><button class="qty" data-act="qty" data-id="'+esc(l.id)+'" aria-label="แก้จำนวน">'+esc(l.qty)+'</button><button data-act="inc" data-id="'+esc(l.id)+'" aria-label="เพิ่ม">+</button></div>'+
    '<div class="ltot">'+baht(l.price*l.qty)+'</div></div>').join(''):'<div class="empty">แตะสินค้าเพื่อใส่ตะกร้า</div>';
  $('#cart').innerHTML='<div class="chead"><h2>ตะกร้า</h2>'+(lines.length?'<button class="link" data-act="cart-clear">ล้างทั้งหมด</button>':'')+'<button class="close" data-act="cart-close" aria-label="ปิด">✕</button></div>'+
    '<div class="lines">'+body+'</div><div class="cfoot"><label class="disc"><span>ส่วนลดท้ายบิล (฿)</span><input id="disc" type="text" inputmode="decimal" autocomplete="off" value="'+(S.discount?esc(S.discount):'')+'" placeholder="0"></label>'+
    '<div class="t2"><span>รวมสินค้า</span><span id="tSub"></span></div><div class="t2 big"><span>ยอดชำระ</span><span id="tTotal" class="tag"></span></div>'+
    '<button id="payBtn" class="btn primary wide" data-act="pay">ชำระเงิน</button></div>';
  updateTotals();
}
function updateTotals(){
  const c=calc();
  if($('#tSub')){$('#tSub').textContent=baht(c.sub);$('#tTotal').textContent=baht(c.total);$('#payBtn').disabled=!S.cart.length;}
  renderCartBar();
}
function renderCartBar(){
  const b=$('#cartbar');if(!b)return;
  if(!S.cart.length){b.hidden=true;$('#cart')&&$('#cart').classList.remove('open');return;}
  const n=S.cart.reduce((a,l)=>a+l.qty,0);
  b.hidden=false;b.innerHTML='<span>ตะกร้า · '+esc(fmt(n))+' ชิ้น</span><span class="tag">'+baht(calc().total)+'</span>';
}
function renderCartAll(){renderGrid();renderCart();}
function addToCart(id,n){
  const p=S.products[id];if(!p)return;
  const line=S.cart.find(l=>l.id===id);
  const cur=round3((line?line.qty:0)+n);
  if(S.settings.blockOut&&cur>(p.stock||0)){toast('สต็อกไม่พอ เหลือ '+fmt(p.stock||0));return;}
  if(line)line.qty=cur;else S.cart.push({id:id,qty:n});
  if(cur>(p.stock||0)&&!S.settings.blockOut)toast('สต็อกในระบบเหลือ '+fmt(p.stock||0)+' — ควรตรวจนับ');
  renderCartAll();
}

/* ---------- payment ---------- */
const schemes=()=>S.settings.schemes||[];
function curScheme(){const l=schemes();return l.find(x=>x.id===P.schemeId)||l[0]||null;}
function payModel(){
  const c=calc();let gov=0,due=c.total,rest=null,mx=0;
  if(P.method==='gov'){const sc=curScheme();mx=sc?govMax(c.eligNet,sc.share,sc.cap):0;gov=Math.min(Math.max(money(num(P.gov)),0),mx);due=money(c.total-gov);rest=due>0?P.rest:null;}
  const cashNeeded=(P.method==='cash'&&due>0)||(P.method==='gov'&&rest==='cash');
  const tendered=money(num(P.tendered));
  const change=cashNeeded?money(tendered-due):0;
  const ok=S.cart.length>0&&(!cashNeeded||tendered>=due)&&(P.method!=='gov'||gov>0);
  return {c:c,gov:gov,due:due,rest:rest,cashNeeded:cashNeeded,tendered:tendered,change:change,ok:ok,mx:mx};
}
function payOpen(){
  if(S.readOnly){toast('บัญชีนี้ดูหลังบ้านได้อย่างเดียว');return;}
  if(!S.cart.length)return;
  const c=calc(),sc=schemes()[0];
  P={method:'cash',schemeId:sc?sc.id:'',gov:sc?govMax(c.eligNet,sc.share,sc.cap):0,govRef:'',rest:'cash',tendered:'',qch:'pp'};
  openSheet('<div id="payRoot"></div>');paintPay();
}
function cashBlock(){
  return '<label class="field"><span>รับเงินมา (฿)</span><input id="tend" data-in="tendered" type="text" inputmode="decimal" autocomplete="off" value="'+esc(P.tendered)+'"></label>'+
    '<div class="quick"><button data-act="quick" data-id="exact">พอดี</button>'+[20,50,100,500,1000].map(v=>'<button data-act="quick" data-id="'+v+'">'+v+'</button>').join('')+'</div><div class="change" id="chg"></div>';
}
function qrHtml(amount){
  const id=S.settings.promptpay;
  if(!id)return '<div class="note">ยังไม่ได้ตั้งค่า QR รับเงิน — ไปที่แท็บ ตั้งค่า > ช่องทาง QR แล้วกรอกเลขพร้อมเพย์ หรือเพิ่มรูป QR ของร้าน</div>';
  const payload=ppPayload(id,amount);
  if(!payload)return '<div class="note">เลขพร้อมเพย์ไม่ถูกต้อง ต้องเป็นเบอร์โทร 10 หลัก หรือเลข 13 หลัก — แก้ในแท็บ ตั้งค่า</div>';
  const svg=qrSvg(payload);
  if(!svg)return '<div class="note">สร้าง QR ไม่ได้ (โหลดตัวสร้าง QR ไม่สำเร็จ) ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</div>';
  return '<div class="qrbox">'+svg+'</div><div class="qrcap">สแกนจ่าย <b>'+baht(amount)+'</b> · '+esc(S.settings.shop)+'</div>';
}
function qrOpts(){const s=S.settings,o=[];if(s.promptpay)o.push({id:'pp',name:'พร้อมเพย์'});(s.qrs||[]).forEach(q=>{if(q.img)o.push({id:q.id,name:q.name||'QR',img:q.img});});return o;}
function channelName(){if(P.qch==='pp')return 'พร้อมเพย์';const q=(S.settings.qrs||[]).find(x=>x.id===P.qch);return (q&&q.name)||'QR';}
function qrBlock(amount){
  const o=qrOpts();
  if(!o.length)return qrHtml(amount);
  if(!o.some(x=>x.id===P.qch))P.qch=o[0].id;
  const chips=o.length>1?'<div class="quick">'+o.map(x=>'<button class="chip" data-act="qch" data-id="'+esc(x.id)+'" aria-pressed="'+(P.qch===x.id)+'">'+esc(x.name)+'</button>').join('')+'</div>':'';
  const cur=o.find(x=>x.id===P.qch);
  if(cur.id==='pp')return chips+qrHtml(amount);
  return chips+'<div class="qrbox"><img alt="QR '+esc(cur.name)+'" src="'+esc(cur.img)+'" style="display:block;width:100%;height:auto"></div><div class="qrcap">สแกนจ่าย <b>'+baht(amount)+'</b> · '+esc(cur.name)+'<br><small>QR นี้ไม่ใส่ยอดอัตโนมัติ ให้ลูกค้ากรอกยอดเอง</small></div>';
}
function paintRest(){
  const el=$('#restBlock');if(!el)return;
  const m=payModel();
  if(m.due<=0){el.innerHTML='';return;}
  el.innerHTML='<div class="seg"><button class="segb" data-act="rm" data-id="cash" aria-selected="'+(P.rest==='cash')+'">ลูกค้าจ่ายส่วนที่เหลือ: เงินสด</button><button class="segb" data-act="rm" data-id="qr" aria-selected="'+(P.rest==='qr')+'">QR</button></div>'+
    (P.rest==='cash'?cashBlock():qrBlock(m.due));
}
function paintPay(){
  const c=calc(),L=schemes();
  const tabs=[['cash','เงินสด'],['qr','QR']];
  if(L.length)tabs.push(['gov',L.length===1?L[0].name:'โครงการรัฐ']);
  const seg=tabs.map(x=>'<button class="segb" role="tab" aria-selected="'+(P.method===x[0])+'" data-act="pm" data-id="'+x[0]+'">'+esc(x[1])+'</button>').join('');
  let body='';
  if(P.method==='cash')body=cashBlock();
  else if(P.method==='qr')body='<div id="qrArea">'+qrBlock(c.total)+'</div>';
  else{
    const sc=curScheme();
    if(!sc)body='<div class="note">ยังไม่มีโครงการรัฐ — เพิ่มได้ที่แท็บ ตั้งค่า</div>';
    else{
      const mx=govMax(c.eligNet,sc.share,sc.cap);
      const chips=L.length>1?'<div class="quick">'+L.map(x=>'<button class="chip" data-act="sch" data-id="'+esc(x.id)+'" aria-pressed="'+(sc.id===x.id)+'">'+esc(x.name)+'</button>').join('')+'</div>':'';
      body=chips+'<div class="govbox"><div class="zrow"><span>ยอดสินค้าที่ร่วมโครงการ</span><i class="lead"></i><b>'+baht(c.eligNet)+'</b></div>'+
        '<label class="field" style="margin-top:8px"><span>รัฐจ่าย (฿) — สูงสุด '+baht(mx)+' ('+esc(sc.share)+'%'+(num(sc.cap)>0?' ไม่เกิน '+baht(num(sc.cap)):'')+')</span><input id="govAmt" data-in="gov" type="text" inputmode="decimal" autocomplete="off" value="'+esc(P.gov)+'"></label>'+
        '<label class="field"><span>เลขอ้างอิงธุรกรรมโครงการ (ถ้ามี)</span><input data-in="govRef" type="text" autocomplete="off" value="'+esc(P.govRef)+'"></label>'+
        '<div class="zrow"><span>ลูกค้าจ่ายเอง</span><i class="lead"></i><b id="govDue"></b></div>'+
        (sc.img?'<details style="margin-top:10px"><summary>แสดง QR ร้านของ'+esc(sc.name)+'</summary><div class="qrbox"><img alt="QR '+esc(sc.name)+'" src="'+esc(sc.img)+'" style="display:block;width:100%;height:auto"></div></details>':'')+
        '</div><div id="restBlock"></div>';
    }
  }
  $('#payRoot').innerHTML='<div class="sheethead"><h2>ชำระเงิน</h2><button class="close" data-act="sheet-close" aria-label="ปิด">✕</button></div>'+
    '<div class="paytotal"><span>ยอดชำระ</span><span class="tag big">'+baht(c.total)+'</span></div><div class="seg" role="tablist">'+seg+'</div>'+body+
    '<button id="payOk" class="btn primary wide" data-act="pay-ok">ยืนยันรับเงิน</button>';
  if(P.method==='gov')paintRest();
  payDyn();
}
function payDyn(){
  if(!P)return;
  const m=payModel();
  const chg=$('#chg');
  if(chg&&m.cashNeeded){
    if(!P.tendered){chg.className='change';chg.textContent='เงินทอน —';}
    else if(m.change>=0){chg.className='change ok';chg.textContent='เงินทอน '+baht(m.change);}
    else{chg.className='change bad';chg.textContent='ยังขาดอีก '+baht(-m.change);}
  }
  if($('#govDue'))$('#govDue').textContent=baht(m.due);
  const ok=$('#payOk');if(ok){ok.disabled=!m.ok;ok.textContent=P.method==='qr'?'ลูกค้าโอนแล้ว — บันทึกบิล':'ยืนยันรับเงิน';}
}
function payInput(t){
  const k=t.dataset.in;
  if(k==='tendered'){P.tendered=t.value;payDyn();}
  else if(k==='govRef'){P.govRef=t.value;}
  else if(k==='gov'){const b=payModel();P.gov=t.value;const a=payModel();if((b.due>0)!==(a.due>0)||(a.due>0&&P.rest==='qr'&&b.due!==a.due))paintRest();payDyn();}
}
let LAST=null,RC=null;
const getBill=id=>S.sales[id]||(LAST&&LAST.id===id?LAST:null);
async function finalize(){
  if(!P)return;
  const m=payModel();if(!m.ok)return;
  const btn=$('#payOk');if(btn)btn.disabled=true;
  const c=m.c,now=new Date(),day=dayStr(now),s=S.settings,sc=P.method==='gov'?curScheme():null;
  const items=S.cart.map(l=>{const p=S.products[l.id];return {pid:p.id,name:p.name,cat:p.cat||'',unit:p.unit||'',barcode:p.barcode||'',price:p.price,cost:p.cost||0,qty:l.qty,eligible:p.eligible!==false,vat:p.vat!==false};});
  const n=Object.values(S.sales).filter(b=>b.day===day).length+1;
  const no=String(now.getFullYear()).slice(2)+pad(now.getMonth()+1)+pad(now.getDate())+'-'+pad(n,3);
  const payments=[];
  if(m.gov>0)payments.push({type:'gov',amount:m.gov,scheme:sc?sc.name:'โครงการรัฐ'});
  const custMethod=P.method==='gov'?m.rest:P.method;
  if(m.due>0&&custMethod){const pm={type:custMethod,amount:m.due};if(custMethod==='qr')pm.channel=channelName();payments.push(pm);}
  const bill={id:uid8(),no:no,ts:now.toISOString(),day:day,items:items,subtotal:c.sub,discount:c.disc,total:c.total,payments:payments,
    gov:m.gov>0?{id:sc?sc.id:'',name:sc?sc.name:'โครงการรัฐ',amount:m.gov,ref:(P.govRef||'').trim()}:null,
    vat:s.taxOn?vatCalc(items,c.disc,s.vatRate):null,
    tendered:m.cashNeeded?m.tendered:null,change:m.cashNeeded?m.change:null,by:S.uid||null,status:'paid'};
  let stockFail=false;
  const stockOps=()=>Promise.all(items.map(it=>{const p=S.products[it.pid];return p?patchStock(it.pid,round3((p.stock||0)-it.qty)).then(()=>true,()=>false):Promise.resolve(true);}));
  if(S.fb){
    try{const r=await Promise.all([putSale(bill),stockOps()]);stockFail=r[1].some(x=>!x);}
    catch(e){toast('บันทึกบิลไม่สำเร็จ ('+((e&&e.code)||'error')+') ลองใหม่อีกครั้ง');if(btn)btn.disabled=false;return;}
    LAST=bill;
  }else{
    try{await putSale(bill);}catch(e){toast('บันทึกบิลไม่สำเร็จ ('+((e&&e.code)||'error')+') ลองใหม่อีกครั้ง');if(btn)btn.disabled=false;return;}
    LAST=bill;
    for(const it of items){const p=S.products[it.pid];if(!p)continue;try{await patchStock(it.pid,round3((p.stock||0)-it.qty));}catch(e){stockFail=true;}}
  }
  S.cart=[];S.discount=0;
  const chg=bill.change,tax=s.taxOn;
  openSheet('<div class="done"><div class="check">✓</div><h2>บันทึกบิล '+esc(bill.no)+' แล้ว</h2>'+
    (chg>0?'<div class="chg"><span>เงินทอน</span><span class="tag big">'+baht(chg)+'</span></div>':'<div style="height:12px"></div>')+
    (stockFail?'<div class="note">ตัดสต็อกไม่ครบทุกรายการ — ตรวจสอบในแท็บสต็อก</div>':'')+
    (S.mode==='shared'?'<p class="muted">ส่งยอดเข้าหลังบ้านแล้ว</p>':'<p class="muted">บันทึกในเครื่องนี้ (ยังไม่เชื่อมหลังบ้าน)</p>')+
    '<div class="btnrow" style="margin:0 0 10px"><button class="btn" data-act="rc-abb" data-id="'+esc(bill.id)+'">'+(tax?'ใบกำกับภาษีอย่างย่อ':'ใบเสร็จรับเงิน')+'</button>'+(tax?'<button class="btn" data-act="inv-full" data-id="'+esc(bill.id)+'">ใบกำกับภาษีเต็มรูปแบบ</button>':'')+'</div>'+
    '<button class="btn primary wide" data-act="sheet-close">ขายรายการต่อไป</button></div>');
  P=null;
  if(S.tab==='sell'){renderCartAll();}

function readImg(file,size){
  size=size||320;
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('img'));
      im.onload=()=>{try{
        const side=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-side)/2,sy=(im.naturalHeight-side)/2,o=Math.min(size,side);
        const c=document.createElement('canvas');c.width=c.height=o;c.getContext('2d').drawImage(im,sx,sy,side,side,0,0,o,o);
        res(c.toDataURL('image/jpeg',0.72));
      }catch(e){rej(e);}};
      im.src=String(fr.result);
    };
    fr.readAsDataURL(file);
  });
}

const HEADMAP={name:['ชื่อสินค้า','ชื่อ','name'],cat:['หมวด','หมวดหมู่','category','cat'],price:['ราคาขาย','ราคา','price'],cost:['ต้นทุน','cost'],stock:['สต็อก','stock','จำนวน'],unit:['หน่วย','unit'],barcode:['บาร์โค้ด','barcode'],eligible:['ร่วมโครงการรัฐ(1/0)','ร่วมโครงการรัฐ','eligible','โครงการรัฐ']};
async function importCsv(text){
  const rows=parseCsv(text);if(rows.length<2){toast('ไม่พบข้อมูลในไฟล์');return;}
  const head=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,''));const idx={};
  Object.keys(HEADMAP).forEach(k=>{idx[k]=head.findIndex(h=>HEADMAP[k].some(a=>a.toLowerCase().replace(/\s+/g,'')===h));});
  if(idx.name<0||idx.price<0){toast('ไฟล์ต้องมีคอลัมน์ ชื่อสินค้า และ ราคาขาย');return;}
  const byKey={};Object.values(S.products).forEach(p=>{if(p.barcode)byKey['b:'+p.barcode]=p;byKey['n:'+(p.name||'').toLowerCase()]=p;});
  const get=(r,k)=>idx[k]>=0?(r[idx[k]]||'').trim():'';
  let n=0;toast('กำลังนำเข้า…');
  try{
    for(const r of rows.slice(1,501)){
      const name=get(r,'name');if(!name)continue;
      const bc=get(r,'barcode');const old=(bc&&byKey['b:'+bc])||byKey['n:'+name.toLowerCase()];
      const el=get(r,'eligible').toLowerCase();
      await putProduct({id:old?old.id:'p'+uid8(),name:name,cat:get(r,'cat')||(old&&old.cat)||'ทั่วไป',unit:get(r,'unit')||(old&&old.unit)||'ชิ้น',price:money(num(get(r,'price'))),
        cost:idx.cost>=0?money(num(get(r,'cost'))):(old?old.cost:0),stock:idx.stock>=0?round3(num(get(r,'stock'))):(old?old.stock:0),low:old&&old.low!=null?old.low:5,barcode:bc,img:(old&&old.img)||'',vat:!(old&&old.vat===false),
        eligible:el===''?(old?old.eligible!==false:true):!(['0','no','false','n','ไม่','ไม่ร่วม'].indexOf(el)>=0)});
      n++;
    }
    toast('นำเข้า/อัปเดต '+n+' รายการแล้ว');
  }catch(e){toast('นำเข้าไม่สำเร็จ ('+((e&&e.code)||'error')+') สำเร็จแล้ว '+n+' รายการ');}
}

async function resolveNames(){

    if(!S.user)return;const els=$$('[data-by]');if(!els.length)return;

  }catch(e){}

function exportCsv(onlyDay){
  const head=['เลขที่บิล','วันที่','เวลา','สถานะ','สินค้า','หมวด','จำนวน','ราคา/หน่วย','รวมบรรทัด','ส่วนลดท้ายบิล','ยอดสุทธิบิล','เงินสด','QR','โครงการรัฐ','ชื่อโครงการ','อ้างอิงโครงการรัฐ','มูลค่าก่อน VAT','VAT'];
  const rows=[head];
  Object.values(S.sales).filter(b=>!onlyDay||b.day===onlyDay).sort((a,b)=>a.ts<b.ts?-1:1).forEach(b=>{
    const pay=t=>(b.payments||[]).filter(p=>p.type===t).reduce((a,p)=>a+p.amount,0);
    (b.items||[]).forEach((it,i)=>{
      const f=i===0;
      rows.push([b.no,b.day,timeOf(b.ts),b.status==='void'?'ยกเลิก':'ขาย',it.name,it.cat||'',it.qty,it.price,money(it.price*it.qty),
        f?(b.discount||0):'',f?b.total:'',f?pay('cash'):'',f?pay('qr'):'',f?pay('gov'):'',f&&b.gov?b.gov.name:'',f&&b.gov?b.gov.ref:'',f&&b.vat?b.vat.base:'',f&&b.vat?b.vat.vat:'']);
    });
  });
  if(rows.length===1){toast('ยังไม่มีข้อมูลให้ส่งออก');return;}
  saveFile('sales-'+(onlyDay||'all')+'.csv',toCsv(rows));
}

  const ok=await ask({title:'ยกเลิกบิล '+b.no+'?',body:'สินค้าในบิลจะถูกคืนเข้าสต็อก และไม่นับรวมในยอดขาย'+(b.taxInv?' (บิลนี้ออกใบกำกับภาษีเต็มรูปแบบไปแล้ว ต้องจัดการใบลดหนี้/ยกเลิกใบกำกับตามขั้นตอนภาษีด้วย)':''),ok:'ยกเลิกบิล',cancel:'ไม่ยกเลิก',danger:true});
  if(ok==null)return;

}

function readImgFit(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const im=new Image();im.onerror=()=>rej(new Error('img'));
      im.onload=()=>{try{
        let out='';
        for(const size of [520,440,360,300]){
          const k=Math.min(1,size/Math.max(im.naturalWidth,im.naturalHeight));
          const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
          const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
          for(const q of [0.8,0.65,0.5]){out=c.toDataURL('image/jpeg',q);if(out.length<=45000)return res(out);}
        }
        res(out);
      }catch(e){rej(e);}};
      im.src=String(fr.result);
    };
    fr.readAsDataURL(file);
  });
}

function parseFbConfig(t){
  const o={};String(t).replace(/["']?([A-Za-z]\w*)["']?\s*:\s*["']([^"']+)["']/g,(m,k,v)=>{o[k]=v;return m;});
  if(!o.apiKey||!o.projectId)return null;
  if(!o.authDomain)o.authDomain=o.projectId+'.firebaseapp.com';
  return o;
}

async function fbConnect(cfg){
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  const ls=src=>new Promise((res,rej)=>{const el=document.createElement('script');const t=setTimeout(()=>rej(new Error('timeout')),12000);el.onload=()=>{clearTimeout(t);res();};el.onerror=()=>{clearTimeout(t);rej(new Error('load'));};el.src=src;document.head.appendChild(el);});
  if(!window.firebase){await ls(base+'firebase-app-compat.js');await Promise.all([ls(base+'firebase-auth-compat.js'),ls(base+'firebase-firestore-compat.js')]);}
  const fb=window.firebase;
  if(!fb.apps.length)fb.initializeApp(cfg);
  const db=fb.firestore();
  try{await db.enablePersistence({synchronizeTabs:true});}catch(e){}
  const auth=fb.auth();
  let u=await new Promise(res=>{const un=auth.onAuthStateChanged(x=>{un();res(x);});});
  if(!u)u=await fbLogin(auth);
  S.fb=true;S.uid=u.uid;S.fbEmail=u.email||'';S.fbAuth=auth;
  return db;
}

  if(t.id==='boDay'&&t.value){S.boDay=t.value;renderBO();}
  else if(t.id==='imgFile'&&t.files&&t.files[0]){const f=t.files[0];t.value='';readImg(f).then(u=>{EDITIMG=u;const el=$('#pfPrev');if(el)el.innerHTML=photoPrev();}).catch(()=>toast('ใช้รูปนี้ไม่ได้ ลองรูปอื่น'));}
  else if(t.id==='qrFile'&&t.files&&t.files[0]){const f=t.files[0];t.value='';readImgFit(f).then(u=>{syncDraft();const arr=QT&&QT.kind==='sch'?S.draft.schemes:S.draft.qrs;if(QT&&arr[QT.idx]){arr[QT.idx].img=u;redrawSettings();}}).catch(()=>toast('ใช้รูปนี้ไม่ได้ ลองรูปอื่น'));}
  else if(t.id==='bkFile'&&t.files&&t.files[0]){const f=t.files[0];const r=new FileReader();r.onload=()=>restoreBackup(String(r.result));r.readAsText(f);t.value='';}
  else if(t.id==='csvFile'&&t.files&&t.files[0]){const f=t.files[0];const r=new FileReader();r.onload=()=>importCsv(String(r.result));r.readAsText(f);t.value='';}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#host .scrim[data-act]'))closeSheet();
  if(e.key==='Enter'&&e.target.id==='q'){
    const q=S.q.trim();if(!q)return;
    const hit=Object.values(S.products).find(p=>p.barcode&&p.barcode===q);
    if(hit){addToCart(hit.id,1);S.q='';e.target.value='';renderGrid();}
  }
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.classList&&d.classList.contains('bill')){if(d.open)S.boOpen.add(d.dataset.bid);else S.boOpen.delete(d.dataset.bid);}},true);

/* ---------- boot ---------- */
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
async function boot(){
  window.__posBooted=true;
  const ll=$('#loadLogo');if(ll){ll.src=LOGO_FULL;ll.hidden=false;}
  const diag=t=>{const e=$('#diag');if(e&&$('#main .loading'))e.textContent=t;};
  window.addEventListener('unhandledrejection',e=>{const r=e.reason;diag('ข้อผิดพลาด: '+((r&&(r.message||r.code))||r));});
  let db=null,user=null,dl=null,decided=false;
  const goLocal=(why)=>{if(decided)return;decided=true;DBH=null;S.mode='local';loadLocal();S.ready=true;render();if(why)toast(why);};
  SKIP=()=>goLocal();
  setTimeout(()=>{const b=$('#skipBtn');if(b)b.hidden=false;},2500);
  const timer=setTimeout(()=>goLocal(),7000);
  const hasHost=!STANDALONE&&!!(window.claude&&typeof window.claude.use==='function');
  diag(hasHost?'พบระบบของ Claude กำลังขอสิทธิ์เก็บข้อมูล…':'กำลังเปิดข้อมูลในเครื่อง…');
  if(hasHost){
    const use=n=>Promise.resolve().then(()=>window.claude.use(n)).catch(()=>null);
    const r=await Promise.all([use('db'),use('user'),use('downloads')]);db=r[0];user=r[1];dl=r[2];
    diag('db: '+(db?'ได้':'ไม่ได้')+' · user: '+(user?'ได้':'ไม่ได้')+' · ไฟล์: '+(dl?'ได้':'ไม่ได้'));
  }
  clearTimeout(timer);
  if(decided)return;
  decided=true;
  try{
    S.dl=dl;S.user=user;
    if(user){try{S.uid=await withTimeout(user.id(),3000);const w=await withTimeout(user.can('data.write'),3000);if(w===false)S.readOnly=true;}catch(e){}}
    if(STANDALONE&&!db){
      const cfg=fbConfig();
      if(cfg){try{db=await fbConnect(cfg);}catch(e){db=null;S.fb=false;toast('เชื่อมคลาวด์ไม่ได้ ('+((e&&(e.message||e.code))||'error')+') ใช้ข้อมูลในเครื่องชั่วคราว');}}
    }
    if(db){DBH=db;S.mode='shared';subscribe();setTimeout(()=>{if(!S.ready){S.ready=true;render();}},8000);}
    else{S.mode='local';loadLocal();S.ready=true;render();}
  }catch(e){
    DBH=null;S.mode='local';S.readOnly=false;loadLocal();S.ready=true;render();toast('เชื่อมหลังบ้านไม่สำเร็จ ใช้โหมดเก็บในเครื่องแทน');
  }
}
(function(){const st=document.createElement('style');st.textContent=RC_CSS;document.head.appendChild(st);})();
boot();
})();
</script>
